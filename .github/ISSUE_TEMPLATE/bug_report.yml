name: Bug report
description: Something in the sample does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, do not open an issue. Follow [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Open the ... tab
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: demo
    attributes:
      label: Which demo
      options:
        - Thinking - Decision Agent
        - Image - Surgical Edit
        - Transcribe - Entity biasing
        - Voice - Personalities
        - Image Flash - Speed
        - Finale - Multimodal
        - Setup / infrastructure
        - Other
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Authentication mode
      options:
        - Keyless (MAI_AUTH_MODE=entra)
        - Resource key (MAI_AUTH_MODE=key)
        - Not configured (fallback only)
    validations:
      required: true
  - type: textarea
    id: smoke
    attributes:
      label: Output of the smoke test
      description: |
        `MAI_EXECUTION_MODE=strict python scripts/live_smoke.py`
        Redact endpoints if you prefer. Never paste a key or a token.
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or tag
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.11 on Windows 11"
    validations:
      required: true
