name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor documented in the README, and the version most contributors
        # actually have installed. A break in either is a break worth seeing.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # Deliberately unpinned: requirements.txt keeps ranges so an incompatible
        # upstream release surfaces here rather than during a live demo.
        # constraints.txt is for reproducing a presented run, not for CI.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (offline / fallback mode)
        run: pytest

  # Infrastructure as code analysis. Rule exclusions, and the reasoning behind
  # them, live in ps-rule.yaml where a reviewer can see them.
  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Analyze Bicep with PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: infra/
          outputFormat: Sarif
          outputPath: reports/ps-rule.sarif
      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/ps-rule.sarif

  # Blocks a pull request that introduces a dependency with a known vulnerability
  # or an incompatible license, before it reaches main.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure
