name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor documented in the README, and the version most contributors
        # actually have installed. A break in either is a break worth seeing.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # Deliberately unpinned: requirements.txt keeps ranges so an incompatible
        # upstream release surfaces here rather than during a live demo.
        # constraints.txt is for reproducing a presented run, not for CI.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (offline / fallback mode)
        run: pytest

  # Infrastructure as code analysis. Rule exclusions, and the reasoning behind
  # them, live in ps-rule.yaml where a reviewer can see them.
  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Analyze Bicep with PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        # The upload below is skipped for forks, so a rule failure has to surface
        # as a failing step rather than only as a code-scanning alert nobody gets.
        continue-on-error: false
        with:
          modules: PSRule.Rules.Azure
          inputPath: infra/
          outputFormat: Sarif
          outputPath: reports/ps-rule.sarif
      # A pull request from a fork gets a read-only token, so uploading SARIF fails
      # there no matter what permissions this job asks for. Skipping it keeps a
      # first-time contributor from seeing a red check they cannot fix. The
      # expression is used rather than a hardcoded repository name on purpose:
      # hardcoding one silently disables the upload the moment the repo is renamed
      # or transferred, which is exactly what is planned here.
      - name: Upload results to code scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/ps-rule.sarif
