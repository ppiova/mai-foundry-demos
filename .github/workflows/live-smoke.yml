name: Live smoke test

# Manual only: this spends real Foundry quota, so it never runs on push or pull request.
# The regular CI workflow stays fully offline.
#
# This is the only place the keyless path is exercised end to end, so it pins
# MAI_AUTH_MODE=entra. Without that pin the run is worse than useless: azure-identity is
# installed on the runner, so a missing identity would fall through to a resource key and
# report PASS for a path it never touched.
#
# Configure once, in the `mai-live` GitHub Environment:
#   Variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              MAI_FOUNDRY_ENDPOINT, MAI_IMAGE_ENDPOINT, MAI_SPEECH_ENDPOINT,
#              MAI_SPEECH_RESOURCE_ID, and the deployment names
#   Azure: a federated credential on the app registration for this repo and environment,
#          holding Cognitive Services User and Cognitive Services Speech User on the
#          account (see the table in README.md)
# No secrets are needed. That is the point.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    environment: mai-live
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for federated sign-in to Azure
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Pinned, unlike the CI test job: this run's results get quoted in
        # docs/API_VERIFIED.md, so it has to be reproducible.
        run: pip install -r requirements.txt -c constraints.txt

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run live smoke test (strict mode, keyless)
        env:
          MAI_EXECUTION_MODE: strict
          MAI_AUTH_MODE: entra
          MAI_FOUNDRY_ENDPOINT: ${{ vars.MAI_FOUNDRY_ENDPOINT }}
          MAI_THINKING_DEPLOYMENT: ${{ vars.MAI_THINKING_DEPLOYMENT || 'MAI-Thinking-1' }}
          MAI_IMAGE_ENDPOINT: ${{ vars.MAI_IMAGE_ENDPOINT }}
          MAI_IMAGE_EDIT_DEPLOYMENT: ${{ vars.MAI_IMAGE_EDIT_DEPLOYMENT || 'MAI-Image-2.5' }}
          MAI_IMAGE_GEN_DEPLOYMENT: ${{ vars.MAI_IMAGE_GEN_DEPLOYMENT || 'MAI-Image-2.5-Flash' }}
          MAI_SPEECH_ENDPOINT: ${{ vars.MAI_SPEECH_ENDPOINT }}
          MAI_SPEECH_RESOURCE_ID: ${{ vars.MAI_SPEECH_RESOURCE_ID }}
          MAI_SPEECH_REGION: ${{ vars.MAI_SPEECH_REGION || 'eastus' }}
        run: python scripts/live_smoke.py
