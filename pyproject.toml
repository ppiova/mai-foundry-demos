# Tooling configuration only. Runtime dependencies live in requirements.txt, which
# stays the install source so Streamlit Community Cloud picks it up automatically.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Long lines are intentional in prompt strings, SSML, and doc URLs.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
